name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $TAG"

      - name: Verify version matches gradle.properties
        run: |
          GRADLE_VERSION=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          TAG_VERSION=${{ steps.version.outputs.version }}

          if [ "$GRADLE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   gradle.properties: $GRADLE_VERSION"
            echo "   Git tag: $TAG_VERSION"
            exit 1
          fi

          echo "✅ Version matches: $GRADLE_VERSION"

      - name: Build & Verify
        run: ./gradlew build verifyPlugin --no-daemon

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## CodeMetrics With Kotlin v${{ steps.version.outputs.version }}

            Published to [JetBrains Marketplace](https://plugins.jetbrains.com/plugin/28221-codemetrics-with-kotlin)

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
