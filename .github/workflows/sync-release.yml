name: Sync to Release

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create/Update release branch
        run: |
          git fetch origin
          git checkout -B release origin/main

      - name: Reset pluginVersion to 0.0.0
        run: |
          sed -i 's/^pluginVersion = .*/pluginVersion = 0.0.0/' gradle.properties

      - name: Commit reset (release branch only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: reset pluginVersion to 0.0.0 on release branch" || echo "No changes to commit"

      - name: Push release branch
        run: git push origin release --force
