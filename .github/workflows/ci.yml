name: CI

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prevent forbidden file changes
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files: $CHANGED"
          if echo "$CHANGED" | grep -E 'gradle.properties|build.gradle.kts|CHANGELOG.md'; then
            echo "❌ Forbidden files changed in PR"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/wrapper-validation-action@v2

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Verify Plugin
        run: ./gradlew verifyPlugin
